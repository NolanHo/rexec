[package]
name = "remote-exec"
version = "0.1.1"
edition = "2024"
description = "Remote code execution + folder sync over SSH with auto-reconnect resilience"
license = "GPL-3.0"
repository = "https://github.com/Menghuan1918/rexec"
keywords = ["ssh", "remote-execution", "rsync", "cli", "sync"]
categories = ["command-line-utilities", "development-tools"]

# Keep the CLI command name `rexec` regardless of the crate/package name,
# so the deployed skill, ~/.local/bin install, and remote ~/.rexec/rexec
# path all stay consistent with the `rexec` command users invoke.
[[bin]]
name = "rexec"
path = "src/main.rs"

[dependencies]
russh = "0.51"
russh-keys = "0.49"
ssh2-config = "0.5"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"
rand = "0.8"
libc = "0.2"
